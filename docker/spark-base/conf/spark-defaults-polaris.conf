###############################################
# Spark Defaults – Iceberg via Polaris (EXPERIMENT)
###############################################
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog=polaris
spark.sql.defaultNamespace=default

spark.sql.catalog.polaris=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.catalog-impl=org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.polaris.uri=http://polaris:8181/api/catalog
spark.sql.catalog.polaris.warehouse=polaris
spark.sql.catalog.polaris.rest.auth.type=oauth2
spark.sql.catalog.polaris.credential=__POLARIS_CLIENT_ID__:__POLARIS_CLIENT_SECRET__
spark.sql.catalog.polaris.oauth2-server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
spark.sql.catalog.polaris.scope=PRINCIPAL_ROLE:ALL
spark.sql.catalog.polaris.token-refresh-enabled=true
spark.sql.catalog.polaris.rest-metrics-reporting-enabled=false
spark.sql.catalog.polaris.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.polaris.s3.endpoint=__S3_ENDPOINT__
spark.sql.catalog.polaris.s3.path-style-access=__S3_PATH_STYLE_ACCESS__
spark.sql.catalog.polaris.s3.region=__S3_REGION__
spark.scheduler.mode=FAIR

spark.pyspark.python=/opt/py311/bin/python
spark.pyspark.driver.python=/opt/py311/bin/python
spark.executorEnv.PYSPARK_PYTHON=/opt/py311/bin/python
spark.yarn.appMasterEnv.PYSPARK_PYTHON=/opt/py311/bin/python

# Generic S3A defaults (object storage for landing-zone reads)
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint=__S3_ENDPOINT__
spark.hadoop.fs.s3a.endpoint.region=__S3_REGION__
spark.hadoop.fs.s3a.path.style.access=__S3_PATH_STYLE_ACCESS__
spark.hadoop.fs.s3a.connection.ssl.enabled=__S3_SSL_ENABLED__
spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider

spark.executorEnv.AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT=true
spark.driver.extraJavaOptions=-DAWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT=true
spark.executor.extraJavaOptions=-DAWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT=true
