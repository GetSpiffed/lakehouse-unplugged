connector.name=iceberg

# Polaris = Iceberg REST catalog
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=polaris

# Auth (Polaris gebruikt OAuth2 client credentials)
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL

# SeaweedFS / S3-compatible settings for Iceberg
hive.s3.endpoint=http://seaweedfs:8333
hive.s3.region=us-east-1
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false



