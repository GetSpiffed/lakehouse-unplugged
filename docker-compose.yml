name: lakehouse-unplugged

services:
  # ======================================================================
  # 🗄️ SeaweedFS mini – lokale S3-compatible opslag (proof-of-concept)
  # ======================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    command: ["mini", "-dir=/data"]
    env_file:
      - ./.env
    environment:
      S3_BUCKET: warehouse
    ports:
      - "8333:8333"  # S3 API (requires AWS authentication; not a browser UI)
      - "8887:8888"  # Filer UI (host 8887 avoids conflict with Jupyter on 8888)
      - "9333:9333"  # Master UI
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --aws-sigv4 "aws:amz:$${AWS_REGION}:s3"
          --user "$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}"
          http://localhost:8333/ >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - lakehouse


  # ======================================================================
  # 🔭 Polaris
  # ======================================================================

  polaris-db:
    image: postgres:16
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    volumes:
      - polaris-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lakehouse

    
  polaris:
    image: apache/polaris:1.5.0
    depends_on:
      polaris-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    platform: linux/amd64
    container_name: polaris
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL_S3: ${S3_ENDPOINT}
      POLARIS_CATALOG_WAREHOUSE: s3://warehouse

      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,admin,password"
      polaris.realm-context.realms: "POLARIS"
      POLARIS_OAUTH2_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_OAUTH2_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}

      POLARIS_UI_ENABLED: "true"
      POLARIS_FEATURES_ICEBERG_COMPAT_ENABLED: "true"
      POLARIS_FEATURES_ICEBERG_COMPAT_PREFIX: "/api/catalog"

      POLARIS_DB_URL: jdbc:postgresql://polaris-db:5432/polaris
      POLARIS_DB_USER: polaris
      POLARIS_DB_PASSWORD: polaris
    ports:
      - "8181:8181"
      - "8182:8182"
      - "8282:8282"
    networks:
      - lakehouse

  polaris-bootstrap:
    build:
      context: ./docker/polaris-bootstrap
    env_file:
      - ./.env
    environment:
      POLARIS_BASE: http://polaris:8181
      S3_ENDPOINT: ${S3_ENDPOINT}
    depends_on:
      polaris:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - lakehouse


  polaris-ui:
    build:
      context: ./docker/polaris-ui
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      POLARIS_BASE_URL: http://polaris:8181
    depends_on:
      polaris:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - lakehouse

  # ======================================================================
  # ⚙️ Spark (Polaris catalog)
  # ======================================================================
  spark-base-builder:
    build:
      context: ./docker/spark-base
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        HADOOP_VERSION: ${HADOOP_VERSION:-3.3.4}
        AWS_SDK_VERSION: ${AWS_SDK_VERSION:-1.12.783}
    image: lakehouse-unplugged-spark-base:latest
    pull_policy: never
    command: ["true"]
    networks:
      - lakehouse

  spark-master:
    image: lakehouse-unplugged-spark-base:latest
    pull_policy: never
    depends_on:
      spark-base-builder:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SPARK_CATALOG_MODE: polaris   # of: filesystem
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"
    networks:
      - lakehouse

  spark-worker:
    image: lakehouse-unplugged-spark-base:latest
    pull_policy: never
    depends_on:
      spark-master:
        condition: service_started
    env_file:
      - ./.env
    environment:
      SPARK_CATALOG_MODE: polaris   # of: filesystem
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
    ports:
      - "8081:8081"
    networks:
      - lakehouse

  thrift-server:
    image: lakehouse-unplugged-spark-base:latest
    pull_policy: never
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      polaris:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SPARK_CATALOG_MODE: polaris   # of: filesystem
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    command: /opt/spark/bin/bootstrap.sh
    volumes:
      - ./docker/thrift-server/bootstrap.sh:/opt/spark/bin/bootstrap.sh:ro
    restart: unless-stopped
    ports:
      - "10000:10000"
    networks:
      - lakehouse



  # ======================================================================
  # 🧠 Trino (analytics via Polaris)
  # ======================================================================
  trino:
    image: trinodb/trino:480
    container_name: trino
    env_file:
      - ./.env
    ports:
      - "8088:8080"
    volumes:
      - ./docker/trino/etc:/etc/trino
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s      
    depends_on:
      polaris:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - lakehouse

  # ======================================================================
  # 📓 Jupyter (Spark driver) - notebooks tegen het Spark cluster
  # ======================================================================
  jupyter:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: lakehouse-unplugged-spark-base:latest
    image: lakehouse-unplugged-jupyter:latest
    depends_on:
      spark-base-builder:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      polaris:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Zorg dat executors de driver terug kunnen bereiken
      SPARK_DRIVER_HOST: jupyter
      SPARK_MASTER: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}

    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    networks:
      - lakehouse
 
  # ======================================================================
  # 💻 Dev Container (VS Code Remote)
  # ======================================================================
  dev:
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
    container_name: lakehouse-unplugged-dev
    command: sleep infinity
  
    depends_on:
      seaweedfs:
        condition: service_healthy
      polaris:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      thrift-server:
        condition: service_started
  
    env_file:
      - ./.env
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_MASTER: spark://spark-master:7077
      S3_ENDPOINT: ${S3_ENDPOINT}
  
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
  
    working_dir: /workspace
    networks:
      - lakehouse

  # ======================================================================
  # 🧰 dbt (Spark Thrift)
  # ======================================================================
  dbt:
    build:
      context: ./docker/dbt
    container_name: dbt
    depends_on:
      thrift-server:
        condition: service_started
    environment:
      DBT_PROFILES_DIR: /usr/app/project
    entrypoint: ["/bin/bash","-lc","tail -f /dev/null"]
    volumes:
      - ./dbt:/usr/app/project
    working_dir: /usr/app/project
    networks:
      - lakehouse
    restart: unless-stopped

  

  # ======================================================================
  # 🌬️ Airflow + Cosmos
  # ======================================================================
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - lakehouse

  airflow-init:
    build:
      context: ./docker/airflow
    image: lakehouse-unplugged-airflow:latest
    pull_policy: never
    depends_on:
      airflow-db:
        condition: service_started
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com"
    networks:
      - lakehouse

  airflow-webserver:
    image: lakehouse-unplugged-airflow:latest
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8089:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dbt:/opt/airflow/dbt_project:ro
      - ./dbt:/opt/airflow/dbt:ro
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: webserver
    networks:
      - lakehouse

  airflow-scheduler:
    image: lakehouse-unplugged-airflow:latest
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dbt:/opt/airflow/dbt_project:ro
      - ./dbt:/opt/airflow/dbt:ro
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    networks:
      - lakehouse

  airflow-triggerer:
    image: lakehouse-unplugged-airflow:latest
    pull_policy: never
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: triggerer
    networks:
      - lakehouse

volumes:
  seaweedfs-data:
  trino-data:
  airflow-db-data:
  polaris-db-data:

networks:
  lakehouse:
    driver: bridge
